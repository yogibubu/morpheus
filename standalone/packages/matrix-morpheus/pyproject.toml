[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-morpheus"
version = "0.1.0rc8"
description = "MORPHEUS semiexperimental refinement for MATRIX"
requires-python = ">=3.11"
dependencies = [
  "matrix-core==0.1.0rc8",
  "matrix-chem==0.1.0rc8",
  "matrix-link==0.1.0rc8",
  "matrix-smith==0.1.0rc8",
  "matrix-gaussian==0.1.0rc8",
  "matrix-oracle==0.1.0rc8",
  "matrix-trinity==0.1.0rc8",
  "numpy>=1.24",
]

[project.optional-dependencies]
fragments = ["matrix-fragments==0.1.0rc8"]

[project.scripts]
morpheus = "matrix_morpheus.cli:main"
matrix-morpheus = "matrix_morpheus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["morpheus_cli_parser"]

[tool.setuptools.package-data]
matrix_morpheus = [
  "data/examples/water/*",
  "parameters/*.toml",
  "parameters/fortran/*.inc",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
# MORPHEUS split modules have completed their Pyflakes cleanup. Keep the
# compatibility-heavy public facade explicit instead of accumulating imports.
extend-select = ["F"]
