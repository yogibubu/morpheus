[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-morpheus"
version = "0.1.0rc6"
description = "MORPHEUS semiexperimental refinement for MATRIX"
requires-python = ">=3.11"
dependencies = [
  "matrix-core==0.1.0rc5",
  "matrix-chem==0.1.0rc5",
  "matrix-link==0.1.0rc5",
  "matrix-smith==0.1.0rc5",
  "matrix-gaussian==0.1.0rc5",
  "matrix-oracle==0.1.0rc7",
  "matrix-trinity==0.1.0rc5",
  "numpy>=1.24",
]

[project.scripts]
morpheus = "matrix_morpheus.cli:main"
matrix-morpheus = "matrix_morpheus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
matrix_morpheus = ["data/examples/water/*"]
