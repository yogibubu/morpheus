[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-link"
version = "0.1.0rc8"
description = "MATRIX geometry realization, PES evaluation, and min/TS optimization"
requires-python = ">=3.11"
dependencies = [
  "matrix-core==0.1.0rc8",
  "matrix-apoc==0.1.0rc8",
  "matrix-chem==0.1.0rc8",
  "matrix-gf==0.1.0rc8",
  "matrix-fragments==0.1.0rc8",
  "matrix-numerics==0.1.0rc8",
  "matrix-oracle==0.1.0rc8",
  "matrix-qm==0.1.0rc8",
  "matrix-smith==0.1.0rc8",
  "matrix-switch==0.1.0rc8",
  "matrix-zaff==0.1.0rc8",
  "numpy>=1.24",
]

[project.scripts]
matrix-link-pose-service = "matrix_link.pose_service:main"

[project.optional-dependencies]
rdkit-fallback = ["matrix-switch[rdkit-fallback]==0.1.0rc8"]
backends = [
  "matrix-cfour==0.1.0rc8",
  "matrix-engines==0.1.0rc8",
  "matrix-et==0.1.0rc8",
  "matrix-gaussian==0.1.0rc8",
  "matrix-molpro==0.1.0rc8",
  "matrix-mrcc==0.1.0rc8",
  "matrix-orca==0.1.0rc8",
  "matrix-pyscf==0.1.0rc8",
  "matrix-xtb==0.1.0rc8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
matrix_link = ["data/*.json"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
# Protect LINK's optimizer and back-transformation module boundaries.
extend-select = ["F"]
