[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-oracle"
version = "0.1.0rc7"
description = "ORACLE topology, symmetry and continuous molecular perception"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matrix-core==0.1.0rc5",
  "matrix-chem==0.1.0rc5",
  "matrix-qm==0.1.0rc5",
  "numpy>=1.24",
]

[project.optional-dependencies]
smiles = ["matrix-link[rdkit]==0.1.0rc5"]
formats = [
  "matrix-apoc[all]==0.1.0rc5",
  "matrix-link==0.1.0rc5",
  "matrix-gaussian==0.1.0rc5",
  "matrix-molpro==0.1.0rc5",
  "matrix-mrcc==0.1.0rc5",
  "matrix-orca==0.1.0rc5",
  "matrix-xtb==0.1.0rc5",
  "matrix-pyscf==0.1.0rc5",
]
qt = [
  "matrix-apoc[all]==0.1.0rc5",
  "PySide6>=6.7",
  "matrix-architect==0.1.0rc5",
  "matrix-gui[qt]==0.1.0rc5",
  "matrix-kinetics==0.1.0rc5",
  "matrix-dvr==0.1.0rc5",
  "matrix-fragments==0.1.0rc5",
  "matrix-gf==0.1.0rc5",
  "matrix-morpheus==0.1.0rc5",
  "matrix-smith==0.1.0rc5",
  "matrix-qm==0.1.0rc5",
  "matrix-rovib==0.1.0rc5",
  "matrix-thermo==0.1.0rc5",
  "matrix-trinity==0.1.0rc5",
  "matrix-vpt2-vci==0.1.0rc5",
  "matrix-xtb==0.1.0rc5",
  "matrix-pyscf==0.1.0rc5",
]
all = [
  "matrix-apoc[all]==0.1.0rc5",
  "matrix-architect==0.1.0rc5",
  "matrix-link[rdkit]==0.1.0rc5",
  "matrix-gaussian==0.1.0rc5",
  "matrix-molpro==0.1.0rc5",
  "matrix-mrcc==0.1.0rc5",
  "matrix-orca==0.1.0rc5",
  "matrix-xtb==0.1.0rc5",
  "matrix-pyscf==0.1.0rc5",
  "PySide6>=6.7",
  "matrix-gui[qt]==0.1.0rc5",
  "matrix-kinetics==0.1.0rc5",
  "matrix-dvr==0.1.0rc5",
  "matrix-fragments==0.1.0rc5",
  "matrix-gf==0.1.0rc5",
  "matrix-morpheus==0.1.0rc5",
  "matrix-smith==0.1.0rc5",
  "matrix-qm==0.1.0rc5",
  "matrix-rovib==0.1.0rc5",
  "matrix-thermo==0.1.0rc5",
  "matrix-trinity==0.1.0rc5",
  "matrix-vpt2-vci==0.1.0rc5",
]

[project.scripts]
oracle = "matrix_oracle.cli:main"
oracle-perception = "matrix_oracle.cli:main"
matrix-oracle = "matrix_oracle.cli:main"
oracle-gui = "matrix_oracle.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
matrix_oracle = ["data/examples/*", "data/*.toml"]
