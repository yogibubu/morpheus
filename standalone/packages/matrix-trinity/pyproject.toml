[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-trinity"
version = "0.1.0rc8"
description = "TRINITY molecular vibrational and anharmonic-field services"
requires-python = ">=3.11"
dependencies = [
  "matrix-core==0.1.0rc8",
  "matrix-chem==0.1.0rc8",
  "matrix-gf==0.1.0rc8",
  "matrix-link==0.1.0rc8",
  "matrix-oracle==0.1.0rc8",
  "matrix-qm==0.1.0rc8",
  "matrix-rovib==0.1.0rc8",
  "matrix-smith==0.1.0rc8",
  "numpy>=1.24",
]

[project.optional-dependencies]
et = ["matrix-et==0.1.0rc8"]
spectroscopy = [
  "matrix-gaussian==0.1.0rc8",
]
anharmonic = [
  "matrix-dvr==0.1.0rc8",
  "matrix-vpt2-vci==0.1.0rc8",
]
zaff-anharmonic = [
  "matrix-dvr==0.1.0rc8",
  "matrix-gf==0.1.0rc8",
  "matrix-vpt2-vci[zaff]==0.1.0rc8",
]
fragments = ["matrix-fragments==0.1.0rc8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
extend-select = ["F"]
