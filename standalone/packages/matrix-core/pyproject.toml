[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-core"
version = "0.1.0rc8"
description = "Core MATRIX infrastructure"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
matrix_core = [
  "data/*.json",
  "schemas/*.json",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
# Core contracts are the shared boundary for every MATRIX package.
extend-select = ["F"]
